name: Stock News Bot

on:
  # schedule:
  #   - cron: '30 0 * * 1-5'  <-- 已注释，交由 Google Scheduler 触发
  workflow_dispatch:

permissions:
  contents: write  # ⚠️ 必须开启写入权限，否则无法保存选股结果

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Pull Latest Changes
        run: git pull --rebase
        
      # 1. 运行早报 (不影响选股)
      - name: Run Daily News
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py daily

      # 2. 运行 AI 选股 (Recommend Mode)
      # 这一步现在会同时生成 stock_pick.json 和 history.csv
      - name: Run AI Recommendation
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py recommend

      # 3. 💾 将选股记忆文件 和 历史战绩表 提交回仓库
      - name: Commit & Push Memory
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          # 强制添加这两个文件 (如果文件不存在也不会报错)
          git add stock_pick.json history.csv || true
          
          # 仅在有实际变化时提交并推送
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Daily Stock Pick & History [skip ci]"
            git push
          fi
