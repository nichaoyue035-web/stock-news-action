name: Stock News Bot

on:
  workflow_dispatch:
    inputs:
      run_source:
        description: "Set to manual_vps_fallback to run this retired GitHub workflow intentionally."
        required: true
        type: choice
        options:
          - manual_vps_fallback

permissions:
  contents: write  # ⚠️ 必须开启写入权限，否则无法保存选股结果

concurrency:
  group: daily-memory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-bot:
    # The VPS now owns the production schedule. A legacy external trigger has no
    # input value, so it creates no job and sends no duplicate notification.
    if: inputs.run_source == 'manual_vps_fallback'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Pull Latest Changes
        run: git pull --rebase
        
      # 1. 运行早报 (不影响选股)
      - name: Run Daily News
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLOBAL_NEWS_RSS: ${{ secrets.GLOBAL_NEWS_RSS }}
          CUSTOM_NEWS_RSS: ${{ secrets.CUSTOM_NEWS_RSS }}
        run: python main.py daily

      # 2. 运行 AI 选股 (Recommend Mode)
      # 这一步现在会同时生成 stock_pick.json 和 history.csv
      - name: Run AI Recommendation
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLOBAL_NEWS_RSS: ${{ secrets.GLOBAL_NEWS_RSS }}
          CUSTOM_NEWS_RSS: ${{ secrets.CUSTOM_NEWS_RSS }}
        run: python main.py recommend

      # 3. 💾 将选股记忆文件 和 历史战绩表 提交回仓库
      - name: Commit & Push Memory
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          # 强制添加这两个文件 (如果文件不存在也不会报错)
          git add stock_pick.json history.csv || true
          
          # 仅在有实际变化时提交并推送
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Daily Stock Pick & History [skip ci]"
            git pull --rebase
            git push || (git pull --rebase && git push)
          fi
