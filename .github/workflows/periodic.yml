name: Periodic Summary

on:
  workflow_dispatch:

jobs:
  run-periodic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 默认会拉取最新的代码（包含 daily.yml 刚提交的 stock_pick.json）
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      # 1. 运行茶歇新闻
      - name: Run Periodic Summary
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLOBAL_NEWS_RSS: ${{ secrets.GLOBAL_NEWS_RSS }}
          CUSTOM_NEWS_RSS: ${{ secrets.CUSTOM_NEWS_RSS }}
        run: python main.py periodic

      # 2. 运行个股追踪 (Track Mode)
      - name: Run Stock Tracker
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLOBAL_NEWS_RSS: ${{ secrets.GLOBAL_NEWS_RSS }}
          CUSTOM_NEWS_RSS: ${{ secrets.CUSTOM_NEWS_RSS }}
        run: python main.py track
